[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secguard"
version = "0.1.0"
description = "ML-derived security risk and dynamic isolation policy for 5Guard"
requires-python = ">=3.10"
dependencies = [
  "joblib==1.5.3",
  "matplotlib==3.11.1",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
fiveguard = [
  "gurobipy>=12.0.0",
  "pyscipopt>=5.0.0",
  "networkx>=3.0",
  "tabulate>=0.9.0",
]

[project.scripts]
secguard-train = "secguard.train:main"
secguard-demo = "secguard.demo:main"
secguard-fiveguard-demo = "secguard.fiveguard_demo:main"
secguard-security-experiment = "secguard.security_experiment:main"
secguard-learn-policy = "secguard.policy_learning:main"
secguard-validate-research = "secguard.research_validation:main"
secguard-admission-control = "secguard.admission_control:main"
secguard-algorithm-selector = "secguard.algorithm_selector:main"
secguard-objective-status = "secguard.objective_status:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
